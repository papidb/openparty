<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenParty</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        width: 320px;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      label {
        display: block;
        margin: 10px 0 6px;
        font-size: 12px;
        font-weight: 600;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
      }

      button {
        margin-top: 12px;
        width: 100%;
        padding: 10px;
      }

      #status {
        margin-top: 10px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>OpenParty</h1>

    <label for="apiBase">API Base</label>
    <input id="apiBase" value="http://localhost:4000" />

    <label for="inviteCode">Invite Code</label>
    <input id="inviteCode" placeholder="e.g. MF2HHF" />

    <button id="saveConfig">Save Config</button>
    <div id="status"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
